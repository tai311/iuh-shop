<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - IUH Shop</title>

    <link rel="stylesheet" href="../CSS/dangnhap.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-container">

            <!-- BÊN TRÁI -->
            <div class="auth-intro">

                <a href="../HTML/trangchu.html" class="auth-logo">
    <span class="auth-logo-icon">
        <img src="../Images/logo-trang.png" alt="IUH">
    </span>

    <span class="auth-logo-text">
        <span class="logo-iuh">IUH</span>
        <span class="logo-shop">SHOP</span>
    </span>
</a>

                <h1>
                    Chào mừng trở lại
                </h1>

                <p>
                    Đăng nhập để tiếp tục mua bán,
                    trao đổi và kết nối cùng cộng đồng sinh viên IUH.
                </p>

            </div>


            <!-- FORM -->
            <div class="auth-form">

                <h2>Đăng nhập</h2>

                <p class="auth-subtitle">
                    Đăng nhập vào tài khoản IUH Shop
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label>
                            Email hoặc mã sinh viên
                        </label>

                        <input
                          type="text"
                          id="loginAccount"
                          placeholder="Nhập email hoặc mã sinh viên"
                          autocomplete="username"
                          required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Mật khẩu
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Nhập mật khẩu"
                                required
                            >

                            <button
                                type="button"
                                onclick="togglePassword('loginPassword', this)"
                                class="password-toggle">
                                Hiện
                            </button>

                        </div>

                    </div>


                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>

                        <a href="#">
                            Quên mật khẩu?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-button">
                        Đăng nhập
                    </button>

                </form>


                <div class="auth-divider">
                    <span>hoặc</span>
                </div>


                <p class="switch-auth">

                    Chưa có tài khoản?

                    <a href="../HTML/dangky.html">
                        Đăng ký ngay
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../JS/dangnhap.js"></script>

</body>

</html>
